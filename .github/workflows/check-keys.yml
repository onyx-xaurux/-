name: Check VPN keys & subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "keys/**"
      - "scripts/**"
      - ".github/workflows/check-keys.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      # (опционально) ключи и подписки из Secrets
      - name: Restore keys & subs from secrets
        if: ${{ secrets.KEYS_B64 != '' || secrets.SUBS_B64 != '' }}
        run: |
          mkdir -p keys
          [ -n "${{ secrets.KEYS_B64 }}" ] && echo "${{ secrets.KEYS_B64 }}" | base64 -d > keys/keys.txt
          [ -n "${{ secrets.SUBS_B64 }}" ] && echo "${{ secrets.SUBS_B64 }}" | base64 -d > keys/subs.txt
          true

      - name: Download sing-box
        run: |
          VER=1.10.7
          curl -sSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv sing-box-${VER}-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Run checker
        env:
          KEYS_FILE: keys/keys.txt
          SUBS_FILE: keys/subs.txt
          PROBE_URL: "https://www.gstatic.com/generate_204"
          TIMEOUT: "15"
          WORKERS: "8"
          SINGBOX: ./sing-box
        run: python scripts/check_keys.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-check-report
          path: |
            report.json
            report.md

      - name: Publish summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true
